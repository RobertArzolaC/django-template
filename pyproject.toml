[project]
name = "django-template"
version = "0.1.0"
description = "Comprehensive template for Django projects"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Django==5.2.13",
    "asgiref==3.11.1",
    "Pillow==12.2.0",
    "django-allauth==65.15.1",
    "django-filter==25.2",
    "django-extensions==4.1",
    "django-model-utils==5.0.0",
    "djangorestframework==3.17.1",
    "django-constance==4.3.5",
    "django-easy-audit==1.3.8",
    "django-widget-tweaks==1.5.1",
    "django-celery-beat==2.9.0",
    "django-sesame==3.2.3",
    "django-formtools==2.5.1",
    "django-cities-light==3.11",
    "django-autocomplete-light==3.12.1",
    "django-tailwind==3.8.0",
    "python-dotenv==1.2.2",
    "python-decouple==3.8",
    "dj-database-url==3.1.2",
    "redis==7.4.0",
    "celery==5.6.3",
    "requests==2.33.1",
    "setuptools==82.0.1",
]

[dependency-groups]
dev = [
    "django-debug-toolbar==6.3.0",
    "django-browser-reload==1.21.0",
    "ruff==0.15.10",
    "pre-commit==4.5.1",
    "Faker==40.13.0",
    "coverage==7.13.5",
    "factory_boy==3.3.3",
]
production = [
    "psycopg2-binary==2.9.11",
    "gunicorn==25.3.0",
    "whitenoise==6.12.0",
]