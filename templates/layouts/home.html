{% load static %}
{% load tailwind_tags %}

<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <title>{{ site.name }} | {% block title_page %}{% endblock title_page %}</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="{% static 'assets/images/logos/logo-minimize.webp' %}" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700" />
    {% tailwind_css %}
    {% block extra_css %}{% endblock extra_css %}
</head>

<body class="min-h-screen bg-base-200 flex flex-col items-center justify-center">
    <div class="w-full max-w-xl p-4">
        {% block content %}{% endblock content %}
    </div>

    {% include 'includes/alerts.html' %}
    {% block extra_js %}{% endblock extra_js %}
</body>
</html>
