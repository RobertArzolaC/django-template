<div class="text-sm breadcrumbs opacity-70 mb-2">
    <ul>
        {% for crumb in breadcrumbs %}
            <li>
                {% if not forloop.last %}
                    <a href="{{ crumb.url }}">{{ crumb.title }}</a>
                {% else %}
                    {{ crumb.title }}
                {% endif %}
            </li>
        {% endfor %}
    </ul>
</div>
